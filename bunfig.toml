[test]
preload = ["./scripts/test-preload.ts"]
# Random order flushes out tests that depend on another file having run first.
randomize = true

[install]
linker = "isolated"
# Link packages from one store in bun's cache instead of copying them into node_modules.
# Warm install after deleting node_modules, measured locally: 7.6 s -> 4.1 s.
globalStore = true
