<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to Inkmark…</title>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
    <p>Returning to the Inkmark app…</p>
    <p><a id="open" href="inkmark://auth">Open Inkmark</a></p>
    <script>
      // Convex Auth only redirects to http(s) origins, so Google sign-in in the
      // mobile app lands here first. Hand the query (?code=… or ?error=…) to the
      // app's deep link, which the in-app auth browser session is waiting for.
      var target = "inkmark://auth" + window.location.search;
      document.getElementById("open").href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
