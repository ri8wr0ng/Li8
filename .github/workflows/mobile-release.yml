name: Mobile release

# Builds the Android app (APK) and attaches it to a GitHub Release.
#
# Release by pushing a tag:   git tag mobile-v1.2.0 && git push origin mobile-v1.2.0
# or run it from the Actions tab with a version number.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   EXPO_PUBLIC_CONVEX_URL  Convex deployment URL (same as VITE_CONVEX_URL)
#   EXPO_PUBLIC_SITE_URL    Deployed web app origin (serves /mobile-auth.html for sign-in)
#
# Optional secrets, to sign with your own key (strongly recommended: Android only
# installs an update over an existing install when it is signed with the same key):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Without them the APK is signed with the shared React Native debug key.
#
# iOS isn't built: an iPhone can only install an app signed with an Apple
# Developer certificate (via TestFlight or the App Store).

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (creates the tag mobile-v<version>)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_CONVEX_URL: ${{ vars.EXPO_PUBLIC_CONVEX_URL }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#mobile-v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0 (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$version" >> "$GITHUB_OUTPUT"

      - name: Check configuration
        run: |
          missing=0
          for name in EXPO_PUBLIC_CONVEX_URL EXPO_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the repository variable $name"
              missing=1
            fi
          done
          exit $missing

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - run: pnpm install --frozen-lockfile

      - name: Set app version
        working-directory: apps/mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = process.env.VERSION;
            config.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
          '

      - name: Generate native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Use release signing key
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the shared debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          cat >> app/build.gradle <<'EOF'

          // Added by .github/workflows/mobile-release.yml
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes.release.signingConfig signingConfigs.release
          }
          EOF

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          path="$RUNNER_TEMP/inkmark-$VERSION.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: inkmark-android-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          notes="Android app for Inkmark $VERSION.

          **Install:** open this page on your Android phone, download \`$(basename "$APK")\`, and open it. Allow installing apps from your browser if Android asks."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Inkmark mobile $VERSION" --notes "$notes"
          fi
