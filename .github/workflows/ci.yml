name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A new commit on a PR cancels that PR's run in progress. Pushes to main and merge-queue
# runs are never cancelled: every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs, none waits on another. Each fails if it runs over budget
# (see scripts/ci/run.ts): setup 15 s, job 35 s, and a budget per check.
jobs:
  checks:
    name: checks (format, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Budgets count from here, so checkout is inside them.
      - run: echo "JOB_START=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: bun scripts/ci/run.ts checks

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Budgets count from here, so checkout is inside them.
      - run: echo "JOB_START=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          # Selection diffs against the PR's base, so it needs history (blobless keeps it cheap).
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: ./.github/actions/setup
      # PRs run only the tests their diff can reach (scripts/ci/select.ts lists what reruns
      # everything). Main and the merge queue run every test and prove every file ran.
      - run: bun scripts/ci/run.ts test
        env:
          TEST_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Budgets count from here, so checkout is inside them.
      - run: echo "JOB_START=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      # Vite runs on the runner's Node, like Vercel. Under bun's runtime Vite emits a
      # different preload helper, so the build stays on Node.
      - run: bun scripts/ci/run.ts build
